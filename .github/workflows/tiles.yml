name: Rebuild tiles

# Raz w miesiącu odświeża kafelki sklepów i stacji z OpenStreetMap. Commit utrzymuje też repozytorium aktywne,
# bo GitHub wyłącza harmonogramy w repozytoriach bez aktywności przez 60 dni.
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Country codes, comma separated'
        default: 'PL'

permissions:
  contents: write
  actions: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Build tiles
        run: node scripts/build-tiles.mjs --countries "${{ inputs.countries || 'PL' }}" --out tiles
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiles
          date -u +%F > .last-tiles-run
          git add .last-tiles-run
          git commit -m "Rebuild tiles $(date -u +%F)" || exit 0
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml
